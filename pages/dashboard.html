<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | TyFlow</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/body.css">
    <link rel="stylesheet" href="../styles/layout.css">
</head>
<body class="layout">
    
    <header class="layout__header topbar">
        <div class="topbar__brand">
            <h2>Inicio</h2>
        </div>

        <div class="topbar__actions">
            <div id="userInfo" class="user-pill" style="display: none;">
                <div class="user-pill__info">
                    <span id="ui-nombre" class="user-pill__name">Cargando...</span>
                    <span id="ui-apellido" class="user-pill__name"></span>
                </div>
                <span id="ui-rol" class="user-pill__role"></span>
            </div>
        </div>
    </header>

    <aside class="layout__sidebar sidebar">
        <nav class="sidebar__nav">
            <div class="sidebar__header">
                <h1 class="sidebar__title">TYFLOW</h1>
            </div>
            
            <ul class="sidebar__list">
                <li class="sidebar__item">
                    <a href="dashboard.html" class="sidebar__link sidebar__link--active">
                        <i class='bx bx-home-alt-2 sidebar__icon'></i> 
                        Inicio
                    </a>
                </li>
                <li class="sidebar__item admin-only">
                    <a href="users.html" class="sidebar__link">
                        <i class='bx bx-user sidebar__icon'></i> 
                        Usuarios
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar__footer">
            <button id="logout-sidebar" class="sidebar__link sidebar__link--logout js-logout">
                <i class='bx bx-power-off sidebar__icon'></i> 
                Cerrar sesión
            </button>
        </div>
    </aside>

    <main class="layout__main">
        <section class="content">
            </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/supabase.js"></script>
    <script src="../scripts/protect.js"></script>
    <script src="../scripts/currentUser.js"></script>
    <script src="../scripts/diagnostics.js"></script>

</body>
</html>
